name: Quality
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

env:
  BOTSPECTOR_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
  BUILD_BUILDID: ${{ github.run_id }}
  BOTSPECTOR_SOURCE_COMMIT: ${{ github.sha }}

jobs:
  validate:
    name: Test and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Verify release tag
        if: inputs.release
        shell: bash
        run: |
          set -euo pipefail
          npm run release:verify-tag -- "$GITHUB_REF"
          git merge-base --is-ancestor HEAD origin/main
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Test with coverage
        run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-junit.xml
      - name: Upload unit results and coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unit-results
          path: |
            test-results/vitest-junit.xml
            coverage/
          if-no-files-found: error
      - run: npm run security:dependencies
      - run: npm run security:secrets
      - run: npm run build
