name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BOTSPECTOR_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
  BUILD_BUILDID: ${{ github.run_id }}
  BOTSPECTOR_SOURCE_COMMIT: ${{ github.sha }}

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  package:
    name: Package and smoke test (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/package-unsigned
        with:
          arch: ${{ matrix.arch }}
